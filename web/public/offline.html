<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BuddyLocation Offline</title>
    <style>
      :root {
        --bg: #05080f;
        --card: rgba(8, 12, 26, 0.88);
        --text: #e8eaff;
        --muted: #8c93b8;
        --accent: #6c63ff;
        --accent2: #00d2ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, rgba(108, 99, 255, 0.22), transparent 40%),
          radial-gradient(circle at 80% 90%, rgba(0, 210, 255, 0.18), transparent 40%), var(--bg);
        color: var(--text);
        font-family: "Space Grotesk", system-ui, sans-serif;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        width: min(480px, 100%);
        background: var(--card);
        border: 1px solid rgba(108, 99, 255, 0.35);
        border-radius: 18px;
        padding: 24px;
        backdrop-filter: blur(8px);
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 12px;
        text-decoration: none;
        color: white;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Offline fallback screen">
      <h1>You are offline</h1>
      <p>BuddyLocation cannot reach the network right now.</p>
      <p>Reconnect to resume live updates. Cached content remains available in the app.</p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
